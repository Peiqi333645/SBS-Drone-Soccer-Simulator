name: Build Drone Soccer Simulator

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-extension:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: windows-latest
            artifact: windows-x86_64
          - os: macos-14
            artifact: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build physics extension
        run: cmake --build build --config Release --parallel 2
      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: drone-soccer-extension-${{ matrix.artifact }}
          path: gdextension/bin/*
          if-no-files-found: error

  package-godot-editor-project:
    name: Package Godot 4.7 editor project for macOS
    needs: build-extension
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS universal physics extension
        uses: actions/download-artifact@v4
        with:
          name: drone-soccer-extension-macos-universal
          path: gdextension/bin

      - name: Verify and package import-ready project
        shell: bash
        run: |
          dylib="$(find gdextension/bin -type f -name 'libdrone_sim.macos.release.universal.dylib' -print -quit)"
          test -n "$dylib"
          if [ "$dylib" != "gdextension/bin/libdrone_sim.macos.release.universal.dylib" ]; then
            cp "$dylib" gdextension/bin/libdrone_sim.macos.release.universal.dylib
          fi
          test -f project.godot
          test -f gdextension/drone_sim.gdextension
          test -f gdextension/bin/libdrone_sim.macos.release.universal.dylib
          mkdir -p package/SBS-Drone-Soccer-Simulator-Godot-4.7
          rsync -a             --exclude '.git'             --exclude '.github'             --exclude '.godot'             --exclude 'build'             --exclude 'package'             ./ package/SBS-Drone-Soccer-Simulator-Godot-4.7/
          ditto -c -k --sequesterRsrc --keepParent             package/SBS-Drone-Soccer-Simulator-Godot-4.7             SBS-Drone-Soccer-Simulator-Godot-4.7-macOS.zip

      - name: Upload Godot editor project
        uses: actions/upload-artifact@v4
        with:
          name: SBS-Drone-Soccer-Simulator-Godot-4.7-macOS
          path: SBS-Drone-Soccer-Simulator-Godot-4.7-macOS.zip
          if-no-files-found: error

  export-game:
    needs: build-extension
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Windows x64
            output: dist/windows/SBS-Drone-Soccer-Simulator.exe
            artifact: SBS-Drone-Soccer-Simulator-Windows-x64
          - preset: macOS Universal
            output: dist/macos/SBS-Drone-Soccer-Simulator.zip
            artifact: SBS-Drone-Soccer-Simulator-macOS-Universal
    steps:
      - uses: actions/checkout@v4

      - name: Download compiled physics extensions
        uses: actions/download-artifact@v4
        with:
          pattern: drone-soccer-extension-*
          path: gdextension/bin
          merge-multiple: true

      - name: Normalize extension paths
        shell: bash
        run: |
          windows_dll="$(find gdextension/bin -type f -name 'drone_sim.windows.release.x86_64.dll' -print -quit)"
          test -n "$windows_dll"
          if [ "$windows_dll" != "gdextension/bin/drone_sim.windows.release.x86_64.dll" ]; then
            cp "$windows_dll" gdextension/bin/drone_sim.windows.release.x86_64.dll
          fi
          test -f gdextension/bin/libdrone_sim.linux.release.x86_64.so
          test -f gdextension/bin/libdrone_sim.macos.release.universal.dylib
          find gdextension/bin -maxdepth 2 -type f -print

      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64

          curl --fail --location --retry 3 \
            --output /tmp/export_templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/export_templates.tpz -d /tmp/godot-templates
          mkdir -p "${HOME}/.local/share/godot/export_templates/4.3.stable"
          cp -R /tmp/godot-templates/templates/. \
            "${HOME}/.local/share/godot/export_templates/4.3.stable/"

      - name: Export playable game
        shell: bash
        run: |
          mkdir -p "$(dirname "${{ matrix.output }}")"
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 \
            --headless \
            --path . \
            --export-release "${{ matrix.preset }}" \
            "${{ matrix.output }}"

      - name: Upload playable game
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
